[project]
name = "sandbox-tinker"
version = "0.1.0"
description = "Experiments for fine-tuning Tinker models."
requires-python = ">=3.11"
dependencies = [
    "datasets>=4.0.0",
    "python-dotenv>=1.0.0",
    "tinker",
    "tinker-cookbook[inkling]>=0.5.3",
]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "ruff>=0.12.0",
]

[tool.uv]
exclude-newer = "7 days"
constraint-dependencies = [
  "mistralai!=2.4.6",
  "guardrails-ai!=0.10.1",
]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
