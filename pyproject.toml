[project]
name = "sandbox-tinker"
version = "0.1.0"
description = "Experiments for fine-tuning Tinker models."
requires-python = ">=3.11"
dependencies = [
    "datasets>=4.0.0",
    "orjson>=3.10.0",
    "python-dotenv>=1.0.0",
    "tinker",
    "tinker-cookbook",
]

[tool.uv]
exclude-newer = "7 days"
constraint-dependencies = [
  "mistralai!=2.4.6",
  "guardrails-ai!=0.10.1",
]
package = false
